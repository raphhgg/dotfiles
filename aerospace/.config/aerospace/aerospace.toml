# You can use it to add commands that run after AeroSpace startup.
# Available commands : https://nikitabobko.github.io/AeroSpace/commands
after-startup-command = [
	'exec-and-forget sketchybar --hotload true & dark-notify -c "sketchybar --reload || echo "',
	'exec-and-forget borders',
	'layout tiles'
]

# Notify Sketchybar about workspace change
exec-on-workspace-change = ['/bin/bash', '-c',
    'sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE'
]

# Start AeroSpace at login
start-at-login = true

# Normalizations. See: https://nikitabobko.github.io/AeroSpace/guide#normalization
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# See: https://nikitabobko.github.io/AeroSpace/guide#layouts
# You can set 0 to disable the padding feature
accordion-padding = 30

# Possible values: tiles|accordion
default-root-container-layout = 'tiles'

# Possible values: horizontal|vertical|auto
# 'auto' means: wide monitor (anything wider than high) gets horizontal orientation,
# tall monitor (anything higher than wide) gets vertical orientation
default-root-container-orientation = 'auto'

# See https://nikitabobko.github.io/AeroSpace/guide#on-focus-changed-callbacks
# See https://nikitabobko.github.io/AeroSpace/commands#move-mouse
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
on-focus-changed = [
  'move-mouse window-lazy-center',
  'exec-and-forget sketchybar --trigger aerospace_focus_change',
]

# You can effectively turn off macOS "Hide application" (cmd-h) feature by toggling this flag
# Useful if you don't use this macOS feature, but accidentally hit cmd-h or cmd-alt-h key
# Also see: https://nikitabobko.github.io/AeroSpace/goodies#disable-hide-app
automatically-unhide-macos-hidden-apps = false

# Possible values: (qwerty|dvorak)
# See https://nikitabobko.github.io/AeroSpace/guide#key-mapping
key-mapping.preset = 'qwerty'

# Gaps between windows (inner-*) and between monitor edges and windows (outer-*)
# Possible values:
# - Constant:     gaps.outer.top = 8
# - Per monitor:  gaps.outer.top = [{ monitor.main = 16 }, { monitor."some-pattern" = 32 }, 8]
#                 In this example, 8 is a default value that is used as a fallback.
#                 If you don't want fallback, use gaps.outer.top = [{ monitor.main = 16 }, { monitor."some-pattern" = 32 }]
#                 "main" is a predefined monitor description that matches the main monitor. You can use arbitrary descriptions
[gaps]
inner.horizontal = 8
inner.vertical =   8
outer.left =       12
outer.bottom =     12
outer.top =        12
outer.right =      12

# 'main' binding mode declaration
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
[mode.main.binding]

# All possible keys:
# - Letters.        a, b, c, ..., z
# - Numbers.        0, 1, 2, ..., 9
# - Keypad numbers. keypad0, keypad1, keypad2, ..., keypad9
# - F-keys.         f1, f2, ..., f20
# - Special keys.   minus, equal, period, comma, slash, backslash, quote, semicolon, backtick,
#                   leftSquareBracket, rightSquareBracket, space, enter, esc, backspace, tab
# - Keypad special. keypadClear, keypadDecimalMark, keypadDivide, keypadEnter, keypadEqual,
#                   keypadMinus, keypadMultiply, keypadPlus
# - Arrows.         left, down, up, right
#

# All possible modifiers: cmd, alt, ctrl, shift
# All possible commands: https://nikitabobko.github.io/AeroSpace/commands

# QWERTY to AZERTY mappings
#
# minus = )
# equal = -
# leftSquareBracket = ^
# rightSquareBracket = $
# quote = ù
# backslash = `
# semicolon = m
# m = ,

# Unknown
# period, comma, slash, backtick
# Normal
# space, enter, tab
# Untested
# esc, backspace

# You can uncomment this line to open up the AeroSpace config in your default editor right from the AeroSpace GUI
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
# See: https://nikitabobko.github.io/AeroSpace/commands#exec-and-forget
# alt-comma = 'exec-and-forget open -a "Finder" ~/.aerospace.toml'

# See: https://nikitabobko.github.io/AeroSpace/commands#layout
# alt-slash = 'layout tiles horizontal vertical'
# alt-comma = 'layout accordion horizontal vertical'

# See: https://nikitabobko.github.io/AeroSpace/commands#focus
cmd-alt-ctrl-shift-h = 'focus left'
cmd-alt-ctrl-shift-j = 'focus down'
cmd-alt-ctrl-shift-k = 'focus up'
cmd-alt-ctrl-shift-l = 'focus right'

# See: https://nikitasbobko.github.io/AeroSpace/commands#resize
# 'equal' is '-' in AZERTY keyboard
cmd-alt-ctrl-shift-equal = 'resize smart -50'
# 'minus is ')'
cmd-alt-ctrl-shift-minus = 'resize smart +50'

# See: https://nikitabobko.github.io/AeroSpace/commands#workspace
cmd-alt-ctrl-shift-1 = 'workspace 1'
cmd-alt-ctrl-shift-2 = 'workspace 2'
cmd-alt-ctrl-shift-3 = 'workspace 3'
cmd-alt-ctrl-shift-4 = 'workspace 4'
cmd-alt-ctrl-shift-5 = 'workspace 5'
cmd-alt-ctrl-shift-6 = 'workspace 6'
cmd-alt-ctrl-shift-7 = 'workspace 7'
cmd-alt-ctrl-shift-8 = 'workspace 8'
cmd-alt-ctrl-shift-9 = 'workspace 9'

# Fullscreen the selected window
# Pressing it again will go back to tiles
cmd-alt-ctrl-shift-enter = 'fullscreen'

# Toggle Finder visibility - show in current workspace or hide using macOS hide
# Logic:
#   - If Finder is currently focused → Hide Finder using macOS native hide
#   - If Finder is not focused → Open Finder and bring to current workspace
#
# TODO: If needed, create an "open" mode and add other apps that needs to be opened like that (i.e: Messages, Slack,...)
# TODO: When opening Claude, bring it to the current workspace
# TODO: Have all the floating windows not tight to a workpace, when opening them they should come floating
# on the currently opened workspace
#
cmd-alt-ctrl-shift-f = 'exec-and-forget /bin/bash -c "if aerospace list-windows --focused | grep -q \"| Finder |\"; then osascript -e \"tell application \\\"System Events\\\" to set visible of process \\\"Finder\\\" to false\"; else open -a Finder && sleep 0.1 && aerospace move-node-to-workspace --focus-follows-window $(aerospace list-workspaces --focused); fi"'

# See: https://nikitabobko.github.io/AeroSpace/commands#workspace-back-and-forth
cmd-alt-ctrl-shift-tab = 'workspace-back-and-forth'

# Sequential workspace navigation will be handled by Karabiner-Elements shell commands
# cmd-tab = 'workspace next --wrap-around'  # Using Karabiner shell command approach
# opt-tab = 'workspace prev --wrap-around'  # Using Karabiner shell command approach

# Monitors
# See: https://nikitabobko.github.io/AeroSpace/commands#move-workspace-to-monitor
# alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

# Modes
# See: https://nikitabobko.github.io/AeroSpace/commands#mode
# Enter move mode with Hyper + "m" (AZERTY "m" key "semicolon" in QWERTY)
cmd-alt-ctrl-shift-semicolon = 'mode move'
# Enter service mode with Hyper + "," (AZERTY "," key "m" in QWERTY)
cmd-alt-ctrl-shift-m = 'mode service'
#
# 'move' binding mode declaration.
# Move windows to workspaces and follow them
[mode.move.binding]
1 = ['move-node-to-workspace 1', 'workspace 1', 'mode main']  # & key on AZERTY
2 = ['move-node-to-workspace 2', 'workspace 2', 'mode main']  # é key on AZERTY
3 = ['move-node-to-workspace 3', 'workspace 3', 'mode main']  # " key on AZERTY
4 = ['move-node-to-workspace 4', 'workspace 4', 'mode main']  # ' key on AZERTY
5 = ['move-node-to-workspace 5', 'workspace 5', 'mode main']  # ( key on AZERTY
6 = ['move-node-to-workspace 6', 'workspace 6', 'mode main']  # § key on AZERTY
7 = ['move-node-to-workspace 7', 'workspace 7', 'mode main']  # è key on AZERTY
8 = ['move-node-to-workspace 8', 'workspace 8', 'mode main']  # ! key on AZERTY
9 = ['move-node-to-workspace 9', 'workspace 9', 'mode main']  # ç key on AZERTY
esc = 'mode main'

# See: https://nikitabobko.github.io/AeroSpace/commands#move
cmd-alt-ctrl-shift-h = 'move left'
cmd-alt-ctrl-shift-j = 'move down'
cmd-alt-ctrl-shift-k = 'move up'
cmd-alt-ctrl-shift-l = 'move right'

[mode.service.binding]
esc = ['reload-config', 'mode main']
#r = ['flatten-workspace-tree', 'mode main'] # reset layout
#s = ['layout sticky tiling', 'mode main'] # sticky is not yet supported https://github.com/nikitabobko/AeroSpace/issues/2
f = ['layout floating tiling', 'mode main'] # Toggle between floating and tiling layout ** Important **
backspace = ['close-all-windows-but-current', 'mode main']

# join 2 windows to have the same parent container
# useful if you have 2 windows that you want on top of the other in horizontal tiles
alt-shift-h = ['join-with left', 'mode main']
alt-shift-j = ['join-with down', 'mode main']
alt-shift-k = ['join-with up', 'mode main']
alt-shift-l = ['join-with right', 'mode main']

# App-to-workspace assignments based on current setup
# Automatically assign apps to workspaces when new windows open
[[on-window-detected]]
if.app-id = 'app.zen-browser.zen'
run = 'move-node-to-workspace 1'

[[on-window-detected]]
if.app-id = 'com.mitchellh.ghostty'
run = 'move-node-to-workspace 2'

[[on-window-detected]]
if.app-id = 'dev.zed.Zed'
run = 'move-node-to-workspace 3'

[[on-window-detected]]
if.app-id = 'com.todesktop.230313mzl4w4u92' # Cursor
run = 'move-node-to-workspace 4'

[[on-window-detected]]
if.app-id = 'com.hnc.Discord'
run = 'move-node-to-workspace 5'

[[on-window-detected]]
if.app-id = 'com.spotify.client'
run = 'move-node-to-workspace 6'

[[on-window-detected]]
if.app-id = 'com.apple.FaceTime'
run = 'move-node-to-workspace 7'

[[on-window-detected]]
if.app-id = 'md.obsidian'
run = 'move-node-to-workspace 8'

[[on-window-detected]]
if.app-id = 'com.flexibits.fantastical2.mac'
run = 'move-node-to-workspace 9'

# Floating apps configuration
[[on-window-detected]]
if.app-id = 'com.apple.finder'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.MobileSMS'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'org.pqrs.Karabiner-Elements.Settings'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'org.pqrs.Karabiner-EventViewer'
run = 'layout floating'

name: Sync to NAS Server

on:
  push:
    branches:
      - main

jobs:
  sync:
    runs-on: [self-hosted, dotfiles]

    steps:
      - name: Sync dotfiles to NAS
        run: |
          set -e
          git config --global --add safe.directory /dotfiles
          cd /dotfiles
          echo "📥 Pulling latest changes from main branch..."
          git remote set-url origin https://x-access-token:${ACCESS_TOKEN}@github.com/raaphhh/dotfiles.git
          git pull origin main
          echo "✅ Dotfiles sync completed successfully!"

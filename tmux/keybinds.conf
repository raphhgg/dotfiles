### ==== CHEATSHEET === ###

# Windows
# prefix + C = create new window
# prefix + N = go to next window
# prefix + numbers = go to window
# prefix + w = kill window
# prefix + @ = list windows

# Panes
# prefix + ) = horizontal split
# prefix + - = vertical split
# prefix + arrows = cycle through panes
# prefix + x = kill pane
# prefix + {} = swap panes around (to configure)
# prefix + n = toggle pane numbers
# prefix + f = zoom into a pane
# prefix + ! = convert a pane to a window (to configure)

# Command mode
# prefix + : = command mode
# - rename-window test
# - rename-session
# - new (create new session)

# Sessions
# prefix + d = detach from session
# prefix + s = list opened sessions
# prefix + q = kill session

# tmux = create new session
# tmux new -s my-session = create a new session with a name
# tmux ls = list all sessions
# tmux attach = re-attach to previous session
# tmux attach -t my-session = attach to a specific session

# Plugins (Session Persistence)
# prefix + Ctrl-s = manual save session (to configure?)
# prefix + Ctrl-r = manual restore session (to configure?)
# Auto-saves every 10 minutes
# Auto-restores on tmux startup

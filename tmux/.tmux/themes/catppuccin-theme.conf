# Catppuccin mocha
# Plugin configuration (must be set before plugin loads)
set -g @catppuccin_flavor 'mocha'

# Texts
# set -g @catppuccin_date_time_text ' 󰭦 %d-%m-%Y 󰅐  %H:%M'
# Use s|/volume1/homes/raphh|~| for ds423plus to handle Synology paths
%if "#{==:#{host},ds423plus}"
set -g @catppuccin_directory_text " #{=|-50|…;s|$HOME|~|:pane_current_path}"
%else
set -g @catppuccin_directory_text " #{=|-50|…;s|$HOME|~|:pane_current_path}"
%endif

# Host icon configuration based on machine
%if "#{==:#{host},ds423plus}"
set -g @catppuccin_host_icon "󰒋 "
%elif "#{==:#{host},MG9FMJYY7DQ}"
set -g @catppuccin_host_icon "􀣺 "
%else
set -g @catppuccin_host_icon "󰒋 "
%endif

# Host colors
set -g @catppuccin_host_icon_color "#{@thm_mauve}"
set -g @catppuccin_host_text_color "#{@thm_text}"

# Status
set -g @catppuccin_status_left_separator  " "
set -g @catppuccin_status_right_separator " "
set -g @catppuccin_status_right_separator_inverse "yes"
set -g @catppuccin_status_connect_separator "no"
set -g @catppuccin_status_modules_left "session"
set -g @catppuccin_status_modules_right "directory host"

# Pane border
set -g @catppuccin_pane_border_style "fg=#{@thm_overlay_0}"
set -g @catppuccin_pane_active_border_style "fg=#{@thm_overlay_2}"

# Windows
set -g @catppuccin_window_number_position 'right'
set -g @catppuccin_window_number '#I'
set -g @catppuccin_window_current_number '#I'
set -g @catppuccin_window_text "#(~/.config/tmux/scripts/window-name.sh #{pane_current_command} #{window_panes} #{pane_pid})"
set -g @catppuccin_window_current_text "#(~/.config/tmux/scripts/window-name.sh #{pane_current_command} #{window_panes} #{pane_pid})"

# Custom window style to handle transparency with glyphs and multi-line status bar
set -g @catppuccin_window_status_style "custom"

# Default window colors
# Left
set -g @catppuccin_window_text_color "#{@thm_surface_0}"
set -g @catppuccin_window_left_separator "#[fg=#{@thm_surface_0},bg="default"]#[bg="default",fg=#{@thm_surface_0}]"
set -g @catppuccin_window_middle_separator "#[fg=#{@thm_surface_0},bg="default"]"█"#[bg="default",fg=#{@thm_surface_0}]"
# Right
set -g @catppuccin_window_number_color "#{@thm_lavender}"
set -g @catppuccin_window_right_separator "#[bg="default",fg=#{@thm_lavender}]#[bg="default",fg=#{@thm_lavender}]"

# Current window colors
# Left
set -g @catppuccin_window_current_text_color "#{@thm_surface_1}"
set -g @catppuccin_window_current_left_separator "#[fg=#{@thm_surface_1},bg="default"]#[bg="default",fg=#{@thm_surface_1}]"
set -g @catppuccin_window_current_middle_separator "#[fg=#{@thm_surface_1},bg="default"]"█"#[bg="default",fg=#{@thm_surface_1}]"
# Right
set -g @catppuccin_window_current_number_color "#{@thm_mauve}"
set -g @catppuccin_window_current_right_separator "#[bg="default",fg=#{@thm_mauve}]#[bg="default",fg=#{@thm_mauve}]"

# Key transparency settings
set -g @catppuccin_status_background "none"

# Status bar dimensions and refresh
set -g status-left-length 100
set -g status-right-length 150
set -g status-interval 5

# Status bar content
set -g status-left '#{E:@catppuccin_status_session}'
set -g status-right '#{E:@catppuccin_status_directory}#{E:@catppuccin_status_host}'

# Multi-status bar for spacing below status bar
set -g status 2
set -g status-format[1] ''

### Global options
# Set default shell to zsh
# Note: tmux will use the shell from $SHELL environment variable if default-shell is not set
# We only need to set this explicitly on systems where $SHELL might be wrong (like Synology)
# On macOS, the system sets $SHELL correctly, so we can rely on that
# For Synology/Linux servers, we need to explicitly set zsh path
%if "#{==:#{host},ds423plus}"
set-option -g default-shell /home/linuxbrew/.linuxbrew/bin/zsh
%endif

# Windows Index start
set -g base-index 1
set -g pane-base-index 1
# Renumber when window is closed
set -g renumber-window on

# Mouse support
set -g mouse on

# Buffer history limit
set -g history-limit 100000

# Enable dynamic terminal titles
set -g set-titles on

# Set terminal title to current pane title
set -g set-titles-string "#{pane_title}"

# Send focus events to applications
set -s focus-events on
# Enable extended key sequences (for better key handling)
set -s extended-keys on
# Remove delay after escape key (faster command sequences)
set -s escape-time 0

# Repeat time (to pass multiple commands after pressing the prefix)
set -g repeat-time 100

# Status bar on top
set-option -g status-position top

# Colors
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

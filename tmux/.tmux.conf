### PREFIX
# HYPER KEY PREFIX - Using F1 function key
# Ghostty: Cmd+Ctrl+Alt+Shift+B → F1 sequence → tmux prefix
unbind C-b

set-option -g prefix F1
bind-key F1 send-prefix

#### WINDOWS
# Belgian AZERTY symbols instead of numbers
unbind '"'
unbind 0
unbind 1
unbind 2
unbind 3
unbind 4
unbind 5
unbind 6
unbind 7
unbind 8
unbind 9

bind-key & select-window -t 1   # 1 key (Belgian: &)
bind-key é select-window -t 2   # 2 key (Belgian: é)
bind-key '"' select-window -t 3 # 3 key (Belgian: ")
bind-key "'" select-window -t 4 # 4 key (Belgian: ')
bind-key ( select-window -t 5   # 5 key (Belgian: ()
bind-key § select-window -t 6   # 6 key (Belgian: §)
bind-key è select-window -t 7   # 7 key (Belgian: è)
bind-key ! select-window -t 8   # 8 key (Belgian: !)
bind-key ç select-window -t 9   # 9 key (Belgian: ç)
bind-key à select-window -t 0   # 0 key (Belgian: à)

#### PANES
unbind %

bind-key ) split-window -h
bind-key - split-window -v

#### NAVIGATION
bind-key @ choose-tree -w \; display "Window selected"  # List windows

#### KILL
bind-key q confirm-before -y -p "Kill session? (Press Enter to confirm, Esc to cancel)" kill-session
bind-key w confirm-before -y -p "Kill window? (Press Enter to confirm, Esc to cancel)" kill-window
bind-key x confirm-before -y -p "Kill pane? (Press Enter to confirm, Esc to cancel)" kill-pane


#### RELOAD
unbind r
 bind r source-file ~/.tmux.conf \; display "Config reloaded!"


### ==== CHEATSHEET === ###

# Windows
# prefix + C = create new window
# prefix + N = go to next window
# prefix + numbers = go to window
# prefix + w = kill window
# prefix + @ = list windows

# Panes
# prefix + ) = horizontal split
# prefix + - = vertical split
# prefix + arrows = cycle through panes
# prefix + x = kill pane

# Command mode
# prefix + : -> command mode
# - rename-window test
# - rename-session

# Sessions
# prefix + d = detach from session
# prefix + s = list opened sessions
# prefix + q = kill session

# tmux = create new session
# tmux ls = list all sessions
# tmux attach = re-attach to previous session

# Plugins (Session Persistence)
# prefix + Ctrl-s = manual save session
# prefix + Ctrl-r = manual restore session
# Auto-saves every 10 minutes
# Auto-restores on tmux startup


### === PLUGINS === ###

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Plugin configuration
set -g @continuum-restore 'on'
set -g @continuum-save-interval '10'
set -g @resurrect-capture-pane-contents 'on'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
# TPM installed via Homebrew in nix-darwin config
run '/opt/homebrew/opt/tpm/share/tpm/tpm'

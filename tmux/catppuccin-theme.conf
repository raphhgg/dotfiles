### Theme
set -g @catppuccin_flavor 'mocha'

### Status bar
set -g status-left-length 100
set -g status-right-length 100
set -g status-interval 5

# Text formatting
set -g @catppuccin_date_time_text ' 󰭦 %d-%m-%Y 󰅐  %H:%M'
set -g @catppuccin_directory_text " #{s|$HOME|~|:#{b:pane_current_path}}"

# Separators
set -g @catppuccin_status_left_separator  " "
set -g @catppuccin_status_right_separator " "
set -g @catppuccin_status_right_separator_inverse "no"
set -g @catppuccin_status_connect_separator "no"

# Left
set -g @catppuccin_status_modules_left "session"
set -gF status-left '#{E:@catppuccin_status_session}'

# Right
set -g @catppuccin_status_modules_right "application date_time"
set -gF status-right '#{E:@catppuccin_status_application}#{E:@catppuccin_status_date_time}'

# Multi-status bar for spacing below status bar (must be after plugin loading)
set -g status 2
set -g status-format[1] ''

### Windows
set -g @catppuccin_window_status 'yes'
set -g @catppuccin_window_status_style 'rounded'
set -g @catppuccin_window_number_position 'right'

set -g @catppuccin_window_text '#W' # #W for WindowName
set -g @catppuccin_window_number '#I' # #I for index
set -g @catppuccin_window_current_number '#I'

set -g @catppuccin_window_default_fill 'number'
set -g @catppuccin_window_default_text '#W'
set -g @catppuccin_window_current_fill 'number'
set -g @catppuccin_window_current_text '#W'
# set -g @catppuccin_window_current_text "#W#{?window_zoomed_flag,(),}"
set -g @catppuccin_window_current_color '#{E:@thm_surface_2}'

set -g @catppuccin_window_left_separator ""
set -g @catppuccin_window_right_separator ""
set -g @catppuccin_window_middle_separator " █"



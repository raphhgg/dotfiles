# Load basic tmux options
source-file ~/.dotfiles/tmux/.tmux/options.conf

# Load plugins
source-file ~/.dotfiles/tmux/.tmux/plugins.conf

# Load explicit theme with complete color control
source-file ~/.dotfiles/tmux/.tmux/themes/catppuccin-theme.conf

# Load keybinds
source-file ~/.dotfiles/tmux/.tmux/keybinds.conf

# Load other plugins via TPM
run '~/.config/tmux/plugins/tpm/tpm'

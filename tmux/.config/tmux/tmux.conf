# Load basic tmux options
source-file ~/github/dotfiles/tmux/.tmux/options.conf

# Load plugins
source-file ~/github/dotfiles/tmux/.tmux/plugins.conf

# Load explicit theme with complete color control
source-file ~/github/dotfiles/tmux/.tmux/themes/catppuccin-theme.conf

# Load keybinds
source-file ~/github/dotfiles/tmux/.tmux/keybinds.conf

# Load other plugins via TPM
run '~/.config/tmux/plugins/tpm/tpm'

# Override nerd-font plugin's automatic-rename-format (icon is handled in window text format instead)
set -g automatic-rename-format "#{pane_current_command}"

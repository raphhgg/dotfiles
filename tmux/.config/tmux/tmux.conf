# Use csi-u for better key handling (required for Pi)
set -g extended-keys-format csi-u

# Load basic tmux options
source-file ~/.tmux/options.conf

# Load plugins
source-file ~/.tmux/plugins.conf

# Load explicit theme with complete color control
source-file ~/.tmux/themes/catppuccin-theme.conf

# Load keybinds
source-file ~/.tmux/keybinds.conf

# Load other plugins via TPM
run '~/.config/tmux/plugins/tpm/tpm'

# Override nerd-font plugin's automatic-rename-format (icon is handled in window text format instead)
# When the shell is the foreground process, keep the current window name (preserves
# restored names and last-run program names). Otherwise, update to the running command.
set -g automatic-rename-format "#{?#{==:#{pane_current_command},zsh},#{window_name},#{pane_current_command}}"

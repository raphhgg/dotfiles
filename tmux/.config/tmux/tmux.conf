source-file ~/.dotfiles/tmux/keybinds.conf
source-file ~/.dotfiles/tmux/plugins.conf
source-file ~/.dotfiles/tmux/catppuccin-theme.conf

# Colors
set -g default-terminal "${TERM}"
set -sg terminal-overrides ",*:RGB"

# Windows Index start
set -g base-index 1
set -g pane-base-index 1
# Renumber when window is closed
set -g renumber-window on

# Pane separator
# set -g pane-border-lines simple
# set -g pane-border-style fg=black,bright
# set -g pane-active-border-style fg=magenta

# Mouse support
set -g mouse on

# Repeat time (to pass multiple commands after pressing the prefix)
set -g repeat-time 100

# Status bar on top
set-option -g status-position top

# Initialize TMUX plugin manager
run '~/.tmux/plugins/tpm/tpm'

# Must be run at the end
source-file ~/.dotfiles/tmux/overrides.conf

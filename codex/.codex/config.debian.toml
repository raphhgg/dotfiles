approval_policy = "on-request"
sandbox_mode = "danger-full-access"

model = "gpt-5.4"
model_reasoning_effort = "medium"

# Add machine-specific trusted project paths in ~/.codex/config.local.toml.
# See codex/.codex/config.debian.local.example.toml for the shape.

[plugins."github@openai-curated"]
enabled = true

[notice.model_migrations]
"gpt-5.3-codex" = "gpt-5.4"

[tui]
status_line = ["model-with-reasoning", "context-remaining", "five-hour-limit", "weekly-limit", "context-window-size"]

[features]
workspace_dependencies = true

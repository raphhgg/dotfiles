approval_policy = "on-request"
sandbox_mode = "danger-full-access"

model = "gpt-5.4"
model_reasoning_effort = "medium"

# Add trusted project paths that make sense on your machine.
# Example:
# [projects."/home/your-user/dotfiles"]
# trust_level = "trusted"

[plugins."github@openai-curated"]
enabled = true

[notice.model_migrations]
"gpt-5.3-codex" = "gpt-5.4"

[tui]
status_line = ["model-with-reasoning", "context-remaining", "five-hour-limit", "weekly-limit", "context-window-size"]

[features]
workspace_dependencies = true

personality = "pragmatic"
model = "gpt-5.4"
model_reasoning_effort = "medium"

approval_policy = "on-request"
sandbox_mode = "danger-full-access"

[history]
persistence = "save-all"

[sandbox_workspace_write]
network_access = true
writable_roots = [
  "/Users/raphh/Projects/homelab-notifications-hub",
  "/Users/raphh/dotfiles/codex/.codex",
  "/Users/raphh/agent-standards",
  "/Users/raphh/Library/Caches/go-build",
  "/Users/raphh/go/pkg/mod"
]

[tools]
web_search = true

[mcp_servers.XcodeBuildMCP]
command = "npx"
args = ["-y", "xcodebuildmcp@latest", "mcp"]

[shell]
auto_approve = [
  "cd /Users/raphh/Projects/homelab-notifications-hub",
  "cd /Users/raphh/dotfiles/codex/.codex",
  "cd /Users/raphh/agent-standards",
  "pwd",
  "ls",
  "cat",
  "rg",
  "find",
  "git status",
  "git diff",
  "git log",
  "git show",
  "git add",
  "git commit",
  "git branch",
  "git switch",
  "git checkout",
  "git pull",
  "git push",
  "go test",
  "go mod tidy",
  "gofmt -w",
  "env GOCACHE="
]
deny = ["rm -rf", "sudo"]

[projects."/Users/raphh/agent-standards"]
trust_level = "trusted"

[projects."/Users/raphh/dotfiles"]
trust_level = "trusted"

[projects."/Users/raphh"]
trust_level = "trusted"

[projects."/Users/raphh/Projects/twitter-cli"]
trust_level = "trusted"

[projects."/Users/raphh/Projects/gather-app"]
trust_level = "trusted"

[projects."/Users/raphh/Projects/codex-usage-menubar-app"]
trust_level = "trusted"

[projects."/Users/raphh/Projects/heimdall"]
trust_level = "trusted"

[projects."/Users/raphh/Projects/review-app"]
trust_level = "trusted"

[projects."/Users/raphh/.codex"]
trust_level = "trusted"

[projects."/Users/raphh/Projects/tiling-window-manager-macos"]
trust_level = "trusted"

[projects."/Users/raphh/Projects/raphhgg"]
trust_level = "trusted"

[projects."/Users/raphh/Projects/CodexPill"]
trust_level = "trusted"

[tui]
status_line = ["model-with-reasoning", "context-remaining", "current-dir", "git-branch", "five-hour-limit", "weekly-limit"]

[features]
apps = false
use_memories = true
generate_memories = true
no_memories_if_mcp_or_web_search = false
remote_connections = true

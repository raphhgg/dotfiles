personality = "pragmatic"
model = "gpt-5.4"
model_reasoning_effort = "medium"

approval_policy = "on-request"
sandbox_mode = "danger-full-access"

[history]
persistence = "save-all"

[sandbox_workspace_write]
network_access = true
writable_roots = [
  "/Users/raphaelgrau/Projects/notifications-hub",
  "/Users/raphaelgrau/dotfiles/codex/.codex",
  "/Users/raphaelgrau/agent-standards",
  "/Users/raphaelgrau/Library/Caches/go-build",
  "/Users/raphaelgrau/go/pkg/mod"
]

[tools]
web_search = true

[mcp_servers.XcodeBuildMCP]
command = "npx"
args = ["-y", "xcodebuildmcp@latest", "mcp"]

[shell]
auto_approve = [
  "cd /Users/raphaelgrau/Projects/notifications-hub",
  "cd /Users/raphaelgrau/dotfiles/codex/.codex",
  "cd /Users/raphaelgrau/agent-standards",
  "pwd",
  "ls",
  "cat",
  "rg",
  "find",
  "git status",
  "git diff",
  "git log",
  "git show",
  "git add",
  "git commit",
  "git branch",
  "git switch",
  "git checkout",
  "git pull",
  "git push",
  "go test",
  "go mod tidy",
  "gofmt -w",
  "env GOCACHE="
]
deny = ["rm -rf", "sudo"]


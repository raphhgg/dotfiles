personality = "pragmatic"
model = "gpt-5.4"
model_reasoning_effort = "medium"

approval_policy = "on-request"
sandbox_mode = "danger-full-access"

[history]
persistence = "save-all"

[sandbox_workspace_write]
network_access = true
writable_roots = [
  "__HOME__/dotfiles/codex/.codex",
  "__HOME__/agent-standards",
  "__HOME__/Library/Caches/go-build",
  "__HOME__/go/pkg/mod"
]

[tools]
web_search = true

[mcp_servers.XcodeBuildMCP]
command = "npx"
args = ["-y", "xcodebuildmcp@latest", "mcp"]

[shell]
auto_approve = [
  "cd __HOME__/dotfiles/codex/.codex",
  "cd __HOME__/agent-standards",
  "pwd",
  "ls",
  "cat",
  "rg",
  "find",
  "git status",
  "git diff",
  "git log",
  "git show",
  "git add",
  "git commit",
  "git branch",
  "git switch",
  "git checkout",
  "git pull",
  "git push",
  "go test",
  "go mod tidy",
  "gofmt -w",
  "env GOCACHE="
]
deny = ["rm -rf", "sudo"]

# Add machine-specific trusted project paths in ~/.codex/config.local.toml.
# See codex/.codex/config.macos.local.example.toml for the shape.

[tui]
status_line = ["model-with-reasoning", "context-remaining", "current-dir", "git-branch", "five-hour-limit", "weekly-limit"]

[features]
apps = false
use_memories = true
generate_memories = true
no_memories_if_mcp_or_web_search = false
remote_connections = true
